# 修改40行的TNAME: NEWIFI3 中的NEWIFI3为你需要编译的型号，注意名称要与trunk/configs/templates/目录下的名字相同
name: 新三NEWIFI3

on: 
  workflow_dispatch:

# 设置仓库的读写权限
permissions:
  contents: write
env:
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@master
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget
    - name: Install UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        version: v4.2.4
        install-only: true
    - name: Clone source code
      env:
        KERNEL: 3.4
      run: |
        git clone --depth=1 https://github.com/${GITHUB_REPOSITORY}.git /opt/rt-n56u
        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images/
        
        ##### 修改内存空间和 storage空间18m
        sed -i 's/0x200000/0x1200000/g' /opt/rt-n56u/trunk/configs/boards/NEWIFI3/kernel-3.4.x.config
        sed -i 's/size_etc="6M"/size_etc="18M"/g' /opt/rt-n56u/trunk/user/scripts/dev_init.sh
        sed -i 's/size_tmp="24M"/size_tmp="120M"/g' /opt/rt-n56u/trunk/user/scripts/dev_init.sh
        sed -i 's/mtd_part_size=65536/mtd_part_size=18874368/g' /opt/rt-n56u/trunk/user/scripts/mtd_storage.sh
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    - name: Build sing-box extended & Auto-config SH script
      run: |
        # Layout: Lay phiên ban sing-box-extended moi nhat
        SB_TAG=$(curl -s https://api.github.com/repos/shtorm-7/sing-box-extended/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
        echo "Latest sing-box-extended version: $SB_TAG"
        [ -z "$SB_TAG" ] && SB_TAG="v1.13.12-extended-2.4.1"
        
        # Priority clone repo extended
        git clone --depth=1 --branch "$SB_TAG" https://github.com/shtorm-7/sing-box-extended.git /tmp/sing-box-src 2>/dev/null || \
        git clone --depth=1 https://github.com/shtorm-7/sing-box-extended.git /tmp/sing-box-src
        
        cd /tmp/sing-box-src
        export GOOS=linux
        export GOARCH=mipsle
        export GOMIPS=softfloat
        export CGO_ENABLED=0
        
        # 1. Build file binary voi Tag toi uu cho Proxy Crawler (Loai bo Tor, Tailscale, Cloudflared)
        mkdir -p /opt/images
        go build -trimpath \
          -tags "with_quic,with_clash_api,with_gvisor,with_dhcp,with_v2ray_api,with_naive_outbound,with_utls,with_shadowsocksr" \
          -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=${SB_TAG}" \
          -o /opt/images/sing-box-mipsle.bin \
          ./cmd/sing-box
        
        upx --lzma --best /opt/images/sing-box-mipsle.bin
        
        # 2. Tìm file singbox.sh trong mã nguồn Padavan và thay thế thông tin tự động
        SH_FILE=$(find /opt/rt-n56u/trunk/user/ -name "*singbox*.sh" -o -name "singbox.sh" | head -n 1)
        
        if [ -f "$SH_FILE" ]; then
          echo "Found script file at: $SH_FILE"
          
          # Tự động thay tên repo yourname/padavan-KVR thành tên repo hiện tại
          sed -i "s|REPO=\"yourname/padavan-KVR\"|REPO=\"${GITHUB_REPOSITORY}\"|g" "$SH_FILE"
          
          # Tự động thay ASSET_NAME thành sing-box-mipsle.bin
          sed -i "s|ASSET_NAME=\"sing-box.bin\"|ASSET_NAME=\"sing-box-mipsle.bin\"|g" "$SH_FILE"
          
          echo "=== KET QUA AUTO-CONFIG TRONG FILE SH ==="
          grep -E "REPO=|ASSET_NAME=" "$SH_FILE"
        else
          echo "WARNING: Khong tim thay file singbox.sh trong thu muc /opt/rt-n56u/trunk/user/"
        fi
        
        echo "SB_TAG=${SB_TAG}" >> $GITHUB_ENV
    - name: Build jq (static mipsel) cho router
      run: |
        JQ_TAG=$(curl -s https://api.github.com/repos/jqlang/jq/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
        echo "Latest jq version: $JQ_TAG"
        [ -z "$JQ_TAG" ] && JQ_TAG="jq-1.7.1"
        JQ_VER="${JQ_TAG#jq-}"

        CROSS_BIN="$(find /opt/rt-n56u/toolchain-mipsel -maxdepth 6 -type d -iname bin 2>/dev/null | head -n1)"
        if [ -z "$CROSS_BIN" ]; then
          echo "!!! Khong tim thay thu muc bin cua toolchain-mipsel -> bo qua build jq"
          exit 0
        fi

        CROSS_GCC="$(find "$CROSS_BIN" -maxdepth 1 -name '*-gcc' 2>/dev/null | head -n1)"
        if [ -z "$CROSS_GCC" ]; then
          echo "!!! Khong tim thay *-gcc trong $CROSS_BIN -> bo qua build jq"
          exit 0
        fi
        CROSS_PREFIX="${CROSS_GCC%gcc}"
        CROSS_TRIPLET="$(basename "$CROSS_PREFIX")"
        CROSS_TRIPLET="${CROSS_TRIPLET%-}"
        export PATH="$CROSS_BIN:$PATH"
        echo "Dung toolchain: $CROSS_GCC (triplet: $CROSS_TRIPLET)"

        JQ_URL="https://github.com/jqlang/jq/releases/download/${JQ_TAG}/jq-${JQ_VER}.tar.gz"
        echo "Tai jq source: $JQ_URL"
        curl -Lo /tmp/jq-src.tar.gz "$JQ_URL" || { echo "!!! Tai jq source that bai -> bo qua"; exit 0; }
        mkdir -p /tmp/jq-src
        tar -xzf /tmp/jq-src.tar.gz -C /tmp/jq-src --strip-components=1
        cd /tmp/jq-src

        CC="$CROSS_GCC" CFLAGS="-Os" ./configure \
          --host="$CROSS_TRIPLET" \
          --disable-shared --enable-static \
          --without-oniguruma \
          --disable-maintainer-mode \
          --disable-docs \
          || { echo "!!! configure jq that bai -> bo qua"; exit 0; }

        make LDFLAGS="-all-static" -j"$(nproc)" \
          || { echo "!!! make jq that bai -> bo qua"; exit 0; }

        if [ -f ./jq ]; then
          JQ_OUT=./jq
        elif [ -f ./jq.exe ]; then
          JQ_OUT=./jq.exe
        else
          echo "!!! Khong tim thay binary jq sau khi build -> bo qua"
          exit 0
        fi

        "${CROSS_PREFIX}strip" "$JQ_OUT" 2>/dev/null || true

        mkdir -p /opt/images
        cp -f "$JQ_OUT" /opt/images/jq-mipsle.bin
        upx --lzma --best /opt/images/jq-mipsle.bin || echo "UPX nen that bai, giu binary chua nen"

        echo "=== KET QUA BUILD JQ ==="
        file /opt/images/jq-mipsle.bin || true
        ls -la /opt/images/jq-mipsle.bin

        SH_FILE=$(find /opt/rt-n56u/trunk/user/ -name "singbox.sh" | head -n1)
        if [ -f "$SH_FILE" ]; then
          if grep -q "JQ_ASSET_NAME=" "$SH_FILE"; then
            sed -i "s|JQ_ASSET_NAME=\".*\"|JQ_ASSET_NAME=\"jq-mipsle.bin\"|g" "$SH_FILE"
            echo "Da cap nhat JQ_ASSET_NAME trong $SH_FILE"
          else
            echo "CANH BAO: $SH_FILE chua co bien JQ_ASSET_NAME - hay dung ban singbox.sh moi nhat"
          fi
        fi
      continue-on-error: true
    - name: Build Firmware
      env:
        TNAME: NEWIFI3
        KERNEL: 3.4
      run: |
        cd /opt/rt-n56u/trunk
        if [ ! -f configs/templates/$TNAME.config ] ; then
          echo "configs/templates/$TNAME.config 没有找到 "
          exit 1
        fi
        cp -f configs/templates/$TNAME.config .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=n/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y/g' .config
        
        ######################################################################
