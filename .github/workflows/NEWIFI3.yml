# 修改40行的TNAME: NEWIFI3 中的NEWIFI3为你需要编译的型号，注意名称要与trunk/configs/templates/目录下的名字相同
name: 新三NEWIFI3

on: 
  workflow_dispatch:

# 设置仓库的读写权限
permissions:
  contents: write
env:
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget
    - name: Install UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        version: v4.2.4
        install-only: true
    - name: Clone source code
      env:
        KERNEL: 3.4
      run: |
        git clone --depth=1 https://github.com/${GITHUB_REPOSITORY}.git /opt/rt-n56u
        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images/
        
        ##### 修改内存空间和 storage空间18m, tmp 256m cho RAM 512MB
        sed -i 's/^CONFIG_MTD_STORE_PART_SIZ=0x200000/CONFIG_MTD_STORE_PART_SIZ=0x1200000/' /opt/rt-n56u/trunk/configs/boards/NEWIFI3/kernel-3.4.x.config
        grep -n 'CONFIG_MTD_STORE_PART_SIZ' /opt/rt-n56u/trunk/configs/boards/NEWIFI3/kernel-3.4.x.config
        sed -i 's/size_etc="6M"/size_etc="18M"/g' /opt/rt-n56u/trunk/user/scripts/dev_init.sh
        grep -n 'size_tmp\|size_etc' /opt/rt-n56u/trunk/user/scripts/dev_init.sh
        sed -i 's/mtd_part_size=65536/mtd_part_size=18874368/g' /opt/rt-n56u/trunk/user/scripts/mtd_storage.sh

        ##### WIFI: 5GHz mặc định US -> CN
        sed -i 's/\(DEF_WLAN_5G_CC[[:space:]]*\)"US"/\1"CN"/' /opt/rt-n56u/trunk/user/shared/defaults.h
        grep -n 'DEF_WLAN_.*_CC' /opt/rt-n56u/trunk/user/shared/defaults.h
    - name: Fix dosfstools timestamps + add CAKE (sch_cake, iproute2 5.12.0)
      run: |
        set -e
        R=/opt/rt-n56u/trunk

        ##### /tmp
        sed -i 's/size_tmp="24M"/size_tmp="160M"/' $R/user/scripts/dev_init.sh
        grep -n 'size_tmp' $R/user/scripts/dev_init.sh

        ##### Fix dosfstools
        D=$R/user/dosfstools/dosfstools-4.2
        if [ -d "$D" ]; then
          touch $D/aclocal.m4; sleep 1
          touch $D/configure $D/config.h.in 2>/dev/null || true; sleep 1
          find $D -name Makefile.in -exec touch {} +
        fi

        ##### CAKE: mượn sch_cake.c + iproute2 5.12.0 từ TW641/padavan-ng
        git clone --depth=1 https://github.com/TW641/padavan-ng /tmp/tw
        T=/tmp/tw/trunk
        test -f $T/linux-3.4.x/net/sched/sch_cake.c
        test -f $T/user/iproute2/iproute2-5.12.0/tc/q_cake.c
        git clone --depth=1 https://github.com/TW641/sch_cake /tmp/sch_cake
        PORT="/tmp/sch_cake/Padavan 3.4.113"
        ls -la "$PORT/"
        F=$R/linux-3.4.x/net/sched/sch_cake.c
        if [ -f "$PORT/sch_cake.c" ]; then
          echo ">>> dùng sch_cake.c từ TW641/sch_cake (Padavan 3.4.113)"
          cp -f "$PORT/sch_cake.c" $F
        else
          echo ">>> không có bản port, dùng bản padavan-ng"
          cp -f $T/linux-3.4.x/net/sched/sch_cake.c $F
        fi
        cat > /tmp/cake_compat.h <<'CEOF'

        /* CAKE_COMPAT34 */
        #include <linux/ip.h>
        #include <linux/ipv6.h>
        #include <linux/in.h>
        #include <linux/vmalloc.h>
        #include <linux/slab.h>
        #include <linux/skbuff.h>
        static inline void cake_kvfree(const void *p)
        { if (is_vmalloc_addr(p)) vfree(p); else kfree(p); }
        /*KEYS_BEGIN*/
        struct cake_flow_keys {
        	__be32 src;
        	__be32 dst;
        	union { __be32 ports; __be16 port16[2]; };
        	u16 thoff;
        	u16 n_proto;
        	u8 ip_proto;
        };
        /*KEYS_END*/
        static bool cake_flow_dissect(const struct sk_buff *cskb, struct cake_flow_keys *k)
        {
        	struct sk_buff *skb = (struct sk_buff *)cskb;
        	int off, hl;
        	u8 proto;
        	memset(k, 0, sizeof(*k));
        	k->n_proto = ntohs(skb->protocol);
        	if (skb->protocol == htons(ETH_P_IP)) {
        		const struct iphdr *iph;
        		if (!pskb_may_pull(skb, sizeof(*iph)))
        			return false;
        		iph = ip_hdr(skb);
        		hl = iph->ihl * 4;
        		k->src = iph->saddr;
        		k->dst = iph->daddr;
        		proto = iph->protocol;
        		off = skb_network_offset(skb) + hl;
        		if (iph->frag_off & htons(IP_MF | IP_OFFSET))
        			proto = 0;
        	} else if (skb->protocol == htons(ETH_P_IPV6)) {
        		const struct ipv6hdr *ip6;
        		if (!pskb_may_pull(skb, sizeof(*ip6)))
        			return false;
        		ip6 = ipv6_hdr(skb);
        		k->src = ip6->saddr.s6_addr32[0] ^ ip6->saddr.s6_addr32[1] ^
        			 ip6->saddr.s6_addr32[2] ^ ip6->saddr.s6_addr32[3];
        		k->dst = ip6->daddr.s6_addr32[0] ^ ip6->daddr.s6_addr32[1] ^
        			 ip6->daddr.s6_addr32[2] ^ ip6->daddr.s6_addr32[3];
        		proto = ip6->nexthdr;
        		hl = sizeof(*ip6);
        		off = skb_network_offset(skb) + hl;
        	} else {
        		return false;
        	}
        	k->ip_proto = proto;
        	k->thoff = off;
        	switch (proto) {
        	case IPPROTO_TCP:
        	case IPPROTO_UDP:
        	case IPPROTO_UDPLITE:
        	case IPPROTO_SCTP:
        	case IPPROTO_DCCP:
        		if (pskb_may_pull(skb, off + 4))
        			k->ports = *(__be32 *)(skb->data + off);
        		break;
        	}
        	return true;
        }
        CEOF
        cat > /tmp/cake_patch.py <<'PEOF'
        import re
        p = "/opt/rt-n56u/trunk/linux-3.4.x/net/sched/sch_cake.c"
        s = open(p).read()
        if "CAKE_COMPAT34" not in s:
            if not re.search(r"#\s*define\s+prandom_u32", s):
                s = re.sub(r"\bprandom_u32\(\)", "random32()", s)
            if not re.search(r"#\s*define\s+kvfree", s):
                s = re.sub(r"\bkvfree\(", "cake_kvfree(", s)
            have_keys = re.search(r"^struct\s+flow_keys\s*\{", s, re.M) is not None
            s = re.sub(r"\bstruct flow_keys\b", "struct cake_flow_keys", s)
            s = re.sub(r"\bskb_flow_dissect\(", "cake_flow_dissect(", s)
            compat = open("/tmp/cake_compat.h").read()
            if have_keys:
                compat = compat.replace("/*KEYS_BEGIN*/", "/*").replace("/*KEYS_END*/", "*/")
            last = [m.end() for m in re.finditer(r"^#include[^\n]*\n", s, re.M)][-1]
            s = s[:last] + compat + s[last:]
            open(p, "w").write(s)
        PEOF
        python3 /tmp/cake_patch.py
        echo "=== kiểm tra API không có trên kernel 3.4 ==="
        grep -nE 'prandom_u32|kvfree|skb_flow_dissect' $R/linux-3.4.x/net/sched/sch_cake.c || true
        for f in $T/linux-3.4.x/net/sched/*; do
          b=$(basename "$f")
          if [ -f "$f" ] && [ ! -e "$R/linux-3.4.x/net/sched/$b" ]; then
            cp -f "$f" "$R/linux-3.4.x/net/sched/$b"; echo "copied new: $b"
          fi
        done
        if [ ! -f $R/linux-3.4.x/net/sched/pkt_sched.h ]; then
          [ -d /tmp/sch_cake ] || git clone --depth=1 https://github.com/TW641/sch_cake /tmp/sch_cake
          ls -la "/tmp/sch_cake/Padavan 3.4.113/"
          for f in "/tmp/sch_cake/Padavan 3.4.113/"*; do
            b=$(basename "$f")
            if [ -f "$f" ] && [ ! -e "$R/linux-3.4.x/net/sched/$b" ]; then
              cp -f "$f" "$R/linux-3.4.x/net/sched/$b"; echo "copied (fallback): $b"
            fi
          done
        fi
        test -f $R/linux-3.4.x/net/sched/pkt_sched.h
        grep -n '#include' $R/linux-3.4.x/net/sched/sch_cake.c | head -30
        grep -q TCA_CAKE_ $R/linux-3.4.x/include/linux/pkt_sched.h || \
          cp -f $T/linux-3.4.x/include/linux/pkt_sched.h $R/linux-3.4.x/include/linux/pkt_sched.h
        KC=$R/configs/boards/NEWIFI3/kernel-3.4.x.config
        sed -i '/^CONFIG_NET_SCH_CAKE=/d; /CONFIG_NET_SCH_CAKE is not set/d' $KC
        echo "CONFIG_NET_SCH_CAKE=y" >> $KC
        for o in NET_SCHED NET_CLS NET_CLS_ACT NET_ACT_MIRRED NET_CLS_U32 NET_SCH_INGRESS IFB; do
          sed -i "/^CONFIG_$o=/d; /^# CONFIG_$o is not set/d" $KC
          echo "CONFIG_$o=y" >> $KC
        done
        sed -i "/^CONFIG_NET_SCH_FQ_CODEL=/d; /^# CONFIG_NET_SCH_FQ_CODEL is not set/d" $KC
        echo "# CONFIG_NET_SCH_FQ_CODEL is not set" >> $KC
        TCP=/opt/rt-n56u/toolchain-mipsel/toolchain-3.4.x/bin/mipsel-linux-uclibc-
        cp -f $KC $R/linux-3.4.x/.config
        yes "" | make -C $R/linux-3.4.x ARCH=mips CROSS_COMPILE=$TCP oldconfig > /tmp/oldconfig.log 2>&1 || true
        tail -n 8 /tmp/oldconfig.log
        cp -f $R/linux-3.4.x/.config $KC
        grep -E "^(# )?CONFIG_(NET_SCHED|NET_SCH_CAKE|NET_SCH_FQ_CODEL|IFB|NET_ACT_MIRRED)[= ]" $KC
        rm -rf $R/user/iproute2
        cp -rf $T/user/iproute2 $R/user/iproute2
        python3 - <<'PYEOF'
        import re
        p = "/opt/rt-n56u/trunk/user/iproute2/iproute2-5.12.0/lib/fs.c"
        s = open(p).read()
        if "FS_COMPAT_UCLIBC" not in s:
            compat = (
                "\n/* FS_COMPAT_UCLIBC */\n"
                "#include <sys/syscall.h>\n#include <unistd.h>\n#include <fcntl.h>\n"
                "#ifndef __NR_name_to_handle_at\n#define __NR_name_to_handle_at 4339\n#endif\n"
                "#ifndef __NR_open_by_handle_at\n#define __NR_open_by_handle_at 4340\n#endif\n"
                "struct file_handle { unsigned int handle_bytes; int handle_type; unsigned char f_handle[]; };\n"
                "static int name_to_handle_at(int d, const char *n, struct file_handle *h, int *m, int f)\n"
                "{ return syscall(__NR_name_to_handle_at, d, n, h, m, f); }\n"
                "static int open_by_handle_at(int m, struct file_handle *h, int f)\n"
                "{ return syscall(__NR_open_by_handle_at, m, h, f); }\n\n"
            )
            last = [m.end() for m in re.finditer(r"^#include[^\n]*\n", s, re.M)][-1]
            s = s[:last] + compat + s[last:]
            open(p, "w").write(s)
        PYEOF
        sed -n 1,40p $R/user/iproute2/iproute2-5.12.0/lib/fs.c
        echo "=== iproute2 Makefile ==="; cat $R/user/iproute2/Makefile
        grep -n CAKE $KC $R/linux-3.4.x/net/sched/Makefile $R/linux-3.4.x/net/sched/Kconfig
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    - name: Build Firmware
      env:
        TNAME: NEWIFI3
        KERNEL: 3.4
      run: |
        cd /opt/rt-n56u/trunk
        if [ ! -f configs/templates/$TNAME.config ] ; then
          echo "configs/templates/$TNAME.config 没有找到 "
          exit 1
        fi
        cp -f configs/templates/$TNAME.config .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=n/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y/g' .config
        
        ######################################################################
        ### Xóa cấu hình mặc định cũ ###
        sed -i '/CONFIG_FIRMWARE_CPU_900MHZ/d' .config
        sed -i '/CONFIG_FIRMWARE_CPU_SLEEP/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_IPV6/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_USB/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_UFSD/d' .config
