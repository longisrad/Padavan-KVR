# 修改40行的TNAME: NEWIFI3 中的NEWIFI3为你需要编译的型号，注意名称要与trunk/configs/templates/目录下的名字相同
name: 新三NEWIFI3

on: 
  workflow_dispatch:

# 设置仓库的读写权限
permissions:
  contents: write
env:
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget
    - name: Install UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        version: v4.2.4
        install-only: true
    - name: Clone source code
      env:
        KERNEL: 3.4
      run: |
        git clone --depth=1 https://github.com/${GITHUB_REPOSITORY}.git /opt/rt-n56u
        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images/
        
        ##### 修改内存空间和 storage空间18m, tmp 256m cho RAM 512MB
        sed -i 's/^CONFIG_MTD_STORE_PART_SIZ=0x200000/CONFIG_MTD_STORE_PART_SIZ=0x1200000/' /opt/rt-n56u/trunk/configs/boards/NEWIFI3/kernel-3.4.x.config
        grep -n 'CONFIG_MTD_STORE_PART_SIZ' /opt/rt-n56u/trunk/configs/boards/NEWIFI3/kernel-3.4.x.config
        sed -i 's/size_etc="6M"/size_etc="18M"/g' /opt/rt-n56u/trunk/user/scripts/dev_init.sh
        # /tmp giữ mặc định của repo (100M). Muốn đổi: sed -i 's/size_tmp="100M"/size_tmp="160M"/' ...dev_init.sh
        grep -n 'size_tmp\|size_etc' /opt/rt-n56u/trunk/user/scripts/dev_init.sh
        sed -i 's/mtd_part_size=65536/mtd_part_size=18874368/g' /opt/rt-n56u/trunk/user/scripts/mtd_storage.sh

        ##### WIFI: 5GHz mặc định US -> CN (driver build không có DFS, tránh Auto rơi vào kênh 52-144)
        sed -i 's/\(DEF_WLAN_5G_CC[[:space:]]*\)"US"/\1"CN"/' /opt/rt-n56u/trunk/user/shared/defaults.h
        grep -n 'DEF_WLAN_.*_CC' /opt/rt-n56u/trunk/user/shared/defaults.h
        ##### WIFI (THỬ NGHIỆM, bỏ dấu # để bật, test riêng từng cái):
        # Bật TxBF cho 5GHz MT7612 (đang bị biên dịch tắt):
        # sed -i 's/^# CONFIG_MT76X2_AP_TXBF_SUPPORT is not set/CONFIG_MT76X2_AP_TXBF_SUPPORT=y/' /opt/rt-n56u/trunk/configs/boards/NEWIFI3/kernel-3.4.x.config
        # Tắt LLTD (chỉ phục vụ Network Map của Windows):
        # sed -i 's/^CONFIG_MT76X2_AP_LLTD=y/# CONFIG_MT76X2_AP_LLTD is not set/; s/^CONFIG_MT7603E_LLTD_SUPPORT=y/# CONFIG_MT7603E_LLTD_SUPPORT is not set/' /opt/rt-n56u/trunk/configs/boards/NEWIFI3/kernel-3.4.x.config
    - name: Fix dosfstools timestamps + add CAKE (sch_cake, iproute2 5.12.0)
      run: |
        set -e
        R=/opt/rt-n56u/trunk

        ##### /tmp: mặc định của repo là 24M (không phải 100M) -> sing-box ~96MB không giải nén nổi
        sed -i 's/size_tmp="24M"/size_tmp="160M"/' $R/user/scripts/dev_init.sh
        grep -n 'size_tmp' $R/user/scripts/dev_init.sh

        ##### Fix dosfstools: chặn make chạy lại automake (aclocal 1.16.1 vs 1.16.5)
        D=$R/user/dosfstools/dosfstools-4.2
        if [ -d "$D" ]; then
          touch $D/aclocal.m4; sleep 1
          touch $D/configure $D/config.h.in 2>/dev/null || true; sleep 1
          find $D -name Makefile.in -exec touch {} +
        fi

        ##### CAKE: mượn sch_cake.c + iproute2 5.12.0 từ TW641/padavan-ng
        # Kconfig + Makefile của net/sched đã được vá sẵn trong repo (có NET_SCH_CAKE)
        git clone --depth=1 https://github.com/TW641/padavan-ng /tmp/tw
        T=/tmp/tw/trunk
        test -f $T/linux-3.4.x/net/sched/sch_cake.c
        test -f $T/user/iproute2/iproute2-5.12.0/tc/q_cake.c
        # sch_cake.c + cobalt_compat.h + pkt_sched.h: lấy bản đã port cho kernel 3.4 từ TW641/sch_cake (Padavan 3.4.113)
        [ -d /tmp/sch_cake ] || git clone --depth=1 https://github.com/TW641/sch_cake /tmp/sch_cake
        PORT="/tmp/sch_cake/Padavan 3.4.113"
        ls -la "$PORT/"
        test -f "$PORT/sch_cake.c"
        for h in sch_cake.c cobalt_compat.h pkt_sched.h; do
          if [ -f "$PORT/$h" ]; then cp -f "$PORT/$h" $R/linux-3.4.x/net/sched/$h; echo "copied (port): $h"; fi
        done
        # bù prandom_u32 / kvfree / skb_flow_dissect cho kernel 3.4 (cobalt_compat.h bản port không có)
        cat > /tmp/cake_compat_block.h <<'CEOF'
        /* === 補上 3.4 核心缺失的三個函式 (prandom_u32 / kvfree / skb_flow_dissect) === */
        #include <linux/random.h>
        #include <linux/mm.h>
        #include <linux/slab.h>
        #include <linux/vmalloc.h>
        #include <linux/ip.h>
        #include <linux/ipv6.h>
        #include <linux/in.h>

        /* prandom_u32(): kernel >= 3.8；3.4 用 random32() */
        #if KERNEL_VERSION(3, 8, 0) > LINUX_VERSION_CODE
        #define prandom_u32() random32()
        #endif

        /* kvfree(): kernel >= 3.15 */
        #if KERNEL_VERSION(3, 15, 0) > LINUX_VERSION_CODE
        static inline void kvfree(const void *addr)
        {
            if (is_vmalloc_addr(addr))
                vfree(addr);
            else
                kfree(addr);
        }
        #endif

        /* skb_flow_dissect(skb, &keys): kernel >= 3.8
         * 用巨集展開，這樣 struct flow_keys 在使用處已經完整定義；
         * 只填 src / dst / ports / ip_proto (IPv6 位址折疊成 32 位元)。 */
        #if KERNEL_VERSION(3, 8, 0) > LINUX_VERSION_CODE
        static inline bool cake_flow_dissect(const struct sk_buff *cskb, __be32 *src,
                                             __be32 *dst, __be32 *ports, u8 *ip_proto)
        {
            struct sk_buff *skb = (struct sk_buff *)cskb;
            int off;
            u8 proto;

            *src = 0; *dst = 0; *ports = 0; *ip_proto = 0;

            if (skb->protocol == htons(ETH_P_IP)) {
                const struct iphdr *iph;

                if (!pskb_may_pull(skb, skb_network_offset(skb) + sizeof(*iph)))
                    return false;
                iph = ip_hdr(skb);
                *src = iph->saddr;
                *dst = iph->daddr;
                proto = iph->protocol;
                off = skb_network_offset(skb) + iph->ihl * 4;
                if (iph->frag_off & htons(IP_MF | IP_OFFSET))
                    proto = 0;              /* 分片：不讀連接埠 */
            } else if (skb->protocol == htons(ETH_P_IPV6)) {
                const struct ipv6hdr *ip6;

                if (!pskb_may_pull(skb, skb_network_offset(skb) + sizeof(*ip6)))
                    return false;
                ip6 = ipv6_hdr(skb);
                *src = ip6->saddr.s6_addr32[0] ^ ip6->saddr.s6_addr32[1] ^
                       ip6->saddr.s6_addr32[2] ^ ip6->saddr.s6_addr32[3];
                *dst = ip6->daddr.s6_addr32[0] ^ ip6->daddr.s6_addr32[1] ^
                       ip6->daddr.s6_addr32[2] ^ ip6->daddr.s6_addr32[3];
                proto = ip6->nexthdr;
                off = skb_network_offset(skb) + sizeof(*ip6);
            } else {
                return false;
            }

            *ip_proto = proto;
            switch (proto) {
            case IPPROTO_TCP:
            case IPPROTO_UDP:
            case IPPROTO_UDPLITE:
            case IPPROTO_SCTP:
            case IPPROTO_DCCP:
                if (pskb_may_pull(skb, off + 4))
                    *ports = *(__be32 *)(skb->data + off);
                break;
            }
            return true;
        }
        #define skb_flow_dissect(skb, keys) \
            cake_flow_dissect((skb), &(keys)->src, &(keys)->dst, &(keys)->ports, &(keys)->ip_proto)
        #endif

        CEOF
        cat > /tmp/cake_hdr_patch.py <<'PEOF'
        import re
        d = "/opt/rt-n56u/trunk/linux-3.4.x/net/sched/"
        p = d + "cobalt_compat.h"
        s = open(p, encoding="utf-8", errors="surrogateescape").read()
        if "cake_flow_dissect" not in s:
            blk = open("/tmp/cake_compat_block.h", encoding="utf-8").read()
            i = s.rindex("#endif")
            s = s[:i] + blk + s[i:]
            open(p, "w", encoding="utf-8", errors="surrogateescape").write(s)
            print("da va cobalt_compat.h")
        else:
            print("cobalt_compat.h da co compat")
        PEOF
        python3 /tmp/cake_hdr_patch.py
        grep -nE 'prandom_u32|kvfree|skb_flow_dissect' $R/linux-3.4.x/net/sched/sch_cake.c $R/linux-3.4.x/net/sched/cobalt_compat.h | head -20
        # chép mọi file phụ TW641 có mà repo mình chưa có (pkt_sched.h, cobalt_compat.h...), không ghi đè file sẵn có
        for f in $T/linux-3.4.x/net/sched/*; do
          b=$(basename "$f")
          if [ -f "$f" ] && [ ! -e "$R/linux-3.4.x/net/sched/$b" ]; then
            cp -f "$f" "$R/linux-3.4.x/net/sched/$b"; echo "copied new: $b"
          fi
        done
        # dự phòng: nếu vẫn thiếu pkt_sched.h thì lấy từ TW641/sch_cake (thư mục Padavan 3.4.113)
        if [ ! -f $R/linux-3.4.x/net/sched/pkt_sched.h ]; then
          [ -d /tmp/sch_cake ] || git clone --depth=1 https://github.com/TW641/sch_cake /tmp/sch_cake
          ls -la "/tmp/sch_cake/Padavan 3.4.113/"
          for f in "/tmp/sch_cake/Padavan 3.4.113/"*; do
            b=$(basename "$f")
            if [ -f "$f" ] && [ ! -e "$R/linux-3.4.x/net/sched/$b" ]; then
              cp -f "$f" "$R/linux-3.4.x/net/sched/$b"; echo "copied (fallback): $b"
            fi
          done
        fi
        test -f $R/linux-3.4.x/net/sched/pkt_sched.h
        grep -n '#include' $R/linux-3.4.x/net/sched/sch_cake.c | head -30
        # header UAPI có TCA_CAKE_*
        grep -q TCA_CAKE_ $R/linux-3.4.x/include/linux/pkt_sched.h || \
          cp -f $T/linux-3.4.x/include/linux/pkt_sched.h $R/linux-3.4.x/include/linux/pkt_sched.h
        # kernel config
        KC=$R/configs/boards/NEWIFI3/kernel-3.4.x.config
        sed -i '/^CONFIG_NET_SCH_CAKE=/d; /CONFIG_NET_SCH_CAKE is not set/d' $KC
        echo "CONFIG_NET_SCH_CAKE=y" >> $KC
        # IFB + mirred/u32/ingress: cần cho CAKE ingress (download) qua ifb0
        for o in NET_SCHED NET_CLS NET_CLS_ACT NET_ACT_MIRRED NET_CLS_U32 NET_SCH_INGRESS IFB; do
          sed -i "/^CONFIG_$o=/d; /^# CONFIG_$o is not set/d" $KC
          echo "CONFIG_$o=y" >> $KC
        done
        # sch_fq_codel.c trong repo không biên dịch được trên kernel 3.4 (skb_flow_dissect) -> tắt; CAKE đã thay thế
        sed -i "/^CONFIG_NET_SCH_FQ_CODEL=/d; /^# CONFIG_NET_SCH_FQ_CODEL is not set/d" $KC
        echo "# CONFIG_NET_SCH_FQ_CODEL is not set" >> $KC
        # Bật NET_SCHED làm xuất hiện hàng loạt tuỳ chọn mới (NET_SCH_CBQ...) -> silentoldconfig
        # sẽ hỏi và abort. Chạy oldconfig với đáp án mặc định để chốt sẵn cấu hình.
        TCP=/opt/rt-n56u/toolchain-mipsel/toolchain-3.4.x/bin/mipsel-linux-uclibc-
        cp -f $KC $R/linux-3.4.x/.config
        yes "" | make -C $R/linux-3.4.x ARCH=mips CROSS_COMPILE=$TCP oldconfig > /tmp/oldconfig.log 2>&1 || true
        tail -n 8 /tmp/oldconfig.log
        cp -f $R/linux-3.4.x/.config $KC
        grep -E "^(# )?CONFIG_(NET_SCHED|NET_SCH_CAKE|NET_SCH_FQ_CODEL|IFB|NET_ACT_MIRRED)[= ]" $KC
        # tc userspace: thay cả thư mục iproute2 bằng bản của TW641
        rm -rf $R/user/iproute2
        cp -rf $T/user/iproute2 $R/user/iproute2
        # uClibc của toolchain này thiếu name_to_handle_at/open_by_handle_at (lib/fs.c) -> bù compat
        python3 - <<'PYEOF'
        import re
        p = "/opt/rt-n56u/trunk/user/iproute2/iproute2-5.12.0/lib/fs.c"
        s = open(p).read()
        if "FS_COMPAT_UCLIBC" not in s:
            compat = (
                "\n/* FS_COMPAT_UCLIBC */\n"
                "#include <sys/syscall.h>\n#include <unistd.h>\n#include <fcntl.h>\n"
                "#ifndef __NR_name_to_handle_at\n#define __NR_name_to_handle_at 4339\n#endif\n"
                "#ifndef __NR_open_by_handle_at\n#define __NR_open_by_handle_at 4340\n#endif\n"
                "struct file_handle { unsigned int handle_bytes; int handle_type; unsigned char f_handle[]; };\n"
                "static int name_to_handle_at(int d, const char *n, struct file_handle *h, int *m, int f)\n"
                "{ return syscall(__NR_name_to_handle_at, d, n, h, m, f); }\n"
                "static int open_by_handle_at(int m, struct file_handle *h, int f)\n"
                "{ return syscall(__NR_open_by_handle_at, m, h, f); }\n\n"
            )
            last = [m.end() for m in re.finditer(r"^#include[^\n]*\n", s, re.M)][-1]
            s = s[:last] + compat + s[last:]
            open(p, "w").write(s)
        PYEOF
        sed -n 1,40p $R/user/iproute2/iproute2-5.12.0/lib/fs.c
        echo "=== iproute2 Makefile ==="; cat $R/user/iproute2/Makefile
        grep -n CAKE $KC $R/linux-3.4.x/net/sched/Makefile $R/linux-3.4.x/net/sched/Kconfig

        ##### CAKE: chỉ vá tầng C (rc / httpd / shared). ASP, cake.sh, state.js chép thủ công vào repo.
        P=$(find "$GITHUB_WORKSPACE" -name patch_cake_backend.py -not -path '*/.git/*' | head -n1)
        if [ -z "$P" ]; then
          echo "::error::Không thấy patch_cake_backend.py trong repo (cần commit vào thư mục cake/). Nội dung repo:"
          ls -la "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/cake" 2>&1 || true
          exit 1
        fi
        echo "Dùng patch: $P"
        python3 "$P" $R
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    - name: Build Firmware
      env:
        TNAME: NEWIFI3
        KERNEL: 3.4
      run: |
        cd /opt/rt-n56u/trunk
        if [ ! -f configs/templates/$TNAME.config ] ; then
          echo "configs/templates/$TNAME.config 没有找到 "
          exit 1
        fi
        cp -f configs/templates/$TNAME.config .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=n/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y/g' .config
        
        ######################################################################
        ### Xóa cấu hình mặc định cũ ###
        sed -i '/CONFIG_FIRMWARE_CPU_900MHZ/d' .config
        sed -i '/CONFIG_FIRMWARE_CPU_SLEEP/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_IPV6/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_USB/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_UFSD/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_FAT/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_EXFAT/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_EXT2/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_EXT3/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_EXT4/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_XFS/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_FUSE/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_SWAP/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_UVC/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_HID/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SERIAL/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_AUDIO/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_XFRM/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_QOS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_IMQ/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_IFB/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_IPSET/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_NFSD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_NFSC/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_CIFS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_NTFS_3G/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_LPRD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_U2EC/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TCPDUMP/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_HDPARM/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_PARTED/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SMBD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SMBD36/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_WINS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SMBD_SYSLOG/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_FTPD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_RPL2TP/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_EAP_PEAP/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_DDNS_SSL/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_HTTPS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SFTP/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_DROPBEAR/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_DROPBEAR_FAST_CODE/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_OPENSSH/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_OPENVPN/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SSWAN/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_XUPNPD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_MINIDLNA/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_FIREFLY/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_FFMPEG_NEW/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TRANSMISSION/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TRANSMISSION_WEB_CONTROL/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ARIA/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ARIA_WEB_CONTROL/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_CURL/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_GDUT_DRCOM/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_DOGCOM/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_MINIEAP/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_NJIT_CLIENT/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_NAPT66/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SSSERVER/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_SERVER/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CLIENT/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CMD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_VLMCSD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TTYD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_LRZSZ/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_HTOP/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_NANO/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_IPERF3/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_DUMP1090/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_RTL_SDR/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_MTR/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SOCAT/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SRELAY/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_MENTOHUST/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPC/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TUNSAFE/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_WIREGUARD/d' .config   
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ZEROTIER/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ALIDDNS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_V2RAY/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_XRAY/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TROJAN/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SSOBFS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_NPC/d' .config
        sed -i '/CONFIG_FIRMWARE_WEBUI_HIDE_VPN/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_OPENVPN/d' .config
        
        ######################################################################
        # Thiết lập các tính năng tích hợp
        ######################################################################
        # OC: ép MT7621 chạy 900MHz (CPU_SLEEP giữ tắt). Nếu treo/nóng: đổi y -> n
        echo "CONFIG_FIRMWARE_CPU_900MHZ=y" >> .config
        echo "CONFIG_FIRMWARE_CPU_SLEEP=n" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_IPV6=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_USB=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_UFSD=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_FAT=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_EXFAT=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_EXT2=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_EXT3=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_EXT4=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_XFS=n" >> .config 
        echo "CONFIG_FIRMWARE_ENABLE_FUSE=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_SWAP=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_UVC=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_HID=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SERIAL=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_AUDIO=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_XFRM=n" >> .config
        # XEM LẠI: QOS/IMQ/IFB chỉ cần nếu dùng QoS trong webui, nếu không đổi thành n
        echo "CONFIG_FIRMWARE_INCLUDE_QOS=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_IMQ=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_IFB=y" >> .config
        
        # BẮT BUỘC BẬT IPSET ĐỂ KERNEL CÓ MODULE TPROXY & MANGLE
        echo "CONFIG_FIRMWARE_INCLUDE_IPSET=y" >> .config
        
        # BẮT BUỘC BẬT TUN CỦA KERNEL ĐỂ TAILSCALE CHẠY ĐƯỢC
        echo "CONFIG_FIRMWARE_INCLUDE_TUNSAFE=y" >> .config
        
        echo "CONFIG_FIRMWARE_INCLUDE_NFSD=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_CIFS=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_NTFS_3G=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_LPRD=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_U2EC=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_TCPDUMP=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_HDPARM=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_PARTED=y" >> .config
        # XEM LẠI: Samba (~1.5MB), đổi n nếu không chia sẻ file USB
        echo "CONFIG_FIRMWARE_INCLUDE_SMBD=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SMBD36=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SMBD_SYSLOG=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_FTPD=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_RPL2TP=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_EAP_PEAP=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_DDNS_SSL=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_HTTPS=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SFTP=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_DROPBEAR=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_DROPBEAR_FAST_CODE=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_OPENSSH=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SSWAN=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_XUPNPD=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_MINIDLNA=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_FIREFLY=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_FFMPEG_NEW=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_TRANSMISSION=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_TRANSMISSION_WEB_CONTROL=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_ARIA=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_ARIA_WEB_CONTROL=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_CURL=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT=n" >> .config
        # XEM LẠI: OpenVPN, đổi n nếu không dùng
        echo "CONFIG_FIRMWARE_INCLUDE_OPENVPN=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_GDUT_DRCOM=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_DOGCOM=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_MINIEAP=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_NJIT_CLIENT=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_NAPT66=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SSSERVER=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_SERVER=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CLIENT=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CMD=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_VLMCSD=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_TTYD=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_LRZSZ=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_HTOP=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_NANO=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_IPERF3=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_DUMP1090=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_RTL_SDR=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_MTR=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SOCAT=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SRELAY=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_MENTOHUST=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_FRPC=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_FRPS=n" >> .config
        # XEM LẠI: WireGuard (~0.9MB), đổi n nếu không dùng; TUNSAFE ở trên giữ nguyên cho tới khi test
        echo "CONFIG_FIRMWARE_INCLUDE_WIREGUARD=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_ZEROTIER=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_ALIDDNS=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_DDNSTO=n" >> .config
        # XEM LẠI: Tailscale native: nếu Tailscale chạy qua sing-box thì đổi n (tiết kiệm nhiều MB)
        echo "CONFIG_FIRMWARE_INCLUDE_TAILSCALE=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_ADGUARDHOME=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_NATPIERCE=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_VNTCLI=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_VNTS=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_CLOUDFLARED=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_LUCKY=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_CLOUDFLARE=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_EASYTIER=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_ALIST=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_WXSEND=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_UUPLUGIN=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_ALDRIVER=n" >> .config
        sed -i 's/EVM_RESTART_ALDRIVER/EVM_RESTART_VIRTUALHERE/g' ./user/httpd/common.h
        echo "CONFIG_FIRMWARE_INCLUDE_VIRTUALHERE=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_WYY=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_BAFA=n" >> .config
        # XEM LẠI: Caddy khá nặng, đổi n nếu không dùng
        echo "CONFIG_FIRMWARE_INCLUDE_CADDY=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SMARTDNS=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_NETCAT=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_MSD_LITE=n" >> .config
        
        # BẬT SINGBOX BẢN THỂ TÍCH HỢP
        echo "CONFIG_FIRMWARE_INCLUDE_SINGBOX=y" >> .config
        
        #########################################################################################
        sudo ./clear_tree
        sudo ./build_firmware_modify $TNAME 0
        grep -E "^(# )?CONFIG_(NET_SCHED|NET_SCH_|NET_CLS|NET_ACT|IFB)" linux-3.4.x/.config || true
        sudo mv -f images/*.trx /opt/images/
        ls -l /opt/images/*.trx
        cp -f .config /opt/images/${TNAME}.config
        echo "build_time=$(date '+%Y年%m月%d日%H:%M:%S' | jq -sRr @uri)" >> $GITHUB_ENV
        echo "tag=$(date '+%Y-%m-%d')" >> $GITHUB_ENV
    - name : Upload packages
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: NEWIFI3
        path: /opt/images

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
           > ### ![](https://img.shields.io/badge/%E7%BC%96%E8%AF%91%E6%97%B6%E9%97%B4-${{ env.build_time }}-8267?logo=github&labelColor=%E9%A1%BB)![](https://img.shields.io/github/downloads/${{ github.repository }}/${{ env.tag }}/total?label=%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&logo=github) 

           `型号.config` 是集成的插件模板
           
        tag_name: ${{ env.tag }}
        files: /opt/images/*
